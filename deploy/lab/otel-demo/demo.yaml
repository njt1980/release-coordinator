apiVersion: apps/v1
kind: Deployment
metadata:
  name: astronomy-db
  namespace: otel-demo
  labels: &id001
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astronomy-db
  template:
    metadata:
      labels: *id001
    spec:
      enableServiceLinks: false
      containers:
      - name: astronomy-db
        image: postgres:18.4
        env:
        - name: POSTGRES_PASSWORD
          value: changeit
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
          limits:
            memory: 80Mi
        args:
        - postgres
        - -c
        - shared_preload_libraries=pg_stat_statements
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: files
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: files
        configMap:
          name: astronomy-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: astronomy-db
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app.kubernetes.io/name: astronomy-db
  ports:
  - name: p5432
    port: 5432
    targetPort: 5432
