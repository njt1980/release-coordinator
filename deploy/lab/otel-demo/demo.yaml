apiVersion: v1
kind: ConfigMap
metadata:
  name: astronomy-db-init
  namespace: otel-demo
data:
  init.sql: "-- Copyright The OpenTelemetry Authors\n-- SPDX-License-Identifier: Apache-2.0\n\
    \n-- Enable pg_stat_statements in the default postgres database\nCREATE EXTENSION\
    \ IF NOT EXISTS pg_stat_statements;\n\n-- Create application user\nCREATE USER\
    \ astronomy_user WITH PASSWORD 'astronomy_password';\n\n-- Create application\
    \ database\nCREATE DATABASE astronomy_db OWNER astronomy_user;\n\n-- Create monitoring\
    \ user with pg_monitor role (visibility on all databases and schemas)\nCREATE\
    \ USER monitoring_user WITH PASSWORD 'monitoring_password';\nGRANT pg_monitor\
    \ TO monitoring_user;\n\n-- Switch to the application database\n\\connect astronomy_db\n\
    \n-- Enable pg_stat_statements in the application database\nCREATE EXTENSION IF\
    \ NOT EXISTS pg_stat_statements;\n\n-- Accounting Service: create a schema\nCREATE\
    \ SCHEMA accounting;\nGRANT USAGE ON SCHEMA accounting TO astronomy_user;\n\n\
    -- Accounting Service: create tables\nCREATE TABLE accounting.\"order\" (\n  \
    \  order_id TEXT PRIMARY KEY\n);\n\nCREATE TABLE accounting.shipping (\n    shipping_tracking_id\
    \ TEXT PRIMARY KEY,\n    shipping_cost_currency_code TEXT NOT NULL,\n    shipping_cost_units\
    \ BIGINT NOT NULL,\n    shipping_cost_nanos INT NOT NULL,\n    street_address\
    \ TEXT,\n    city TEXT,\n    state TEXT,\n    country TEXT,\n    zip_code TEXT,\n\
    \    order_id TEXT NOT NULL,\n    FOREIGN KEY (order_id) REFERENCES accounting.\"\
    order\"(order_id) ON DELETE CASCADE\n);\n\nCREATE TABLE accounting.orderitem (\n\
    \    item_cost_currency_code TEXT NOT NULL,\n    item_cost_units BIGINT NOT NULL,\n\
    \    item_cost_nanos INT NOT NULL,\n    product_id TEXT NOT NULL,\n    quantity\
    \ INT NOT NULL,\n    order_id TEXT NOT NULL,\n    PRIMARY KEY (order_id, product_id),\n\
    \    FOREIGN KEY (order_id) REFERENCES accounting.\"order\"(order_id) ON DELETE\
    \ CASCADE\n);\n\n-- Accounting Service: grant permission to schema\nGRANT SELECT,\
    \ INSERT, UPDATE ON ALL TABLES IN SCHEMA accounting TO astronomy_user;\n\n-- Product\
    \ Catalog Service: create a schema\nCREATE SCHEMA catalog;\nGRANT USAGE ON SCHEMA\
    \ catalog TO astronomy_user;\n\n-- Product Catalog Service: create tables\nCREATE\
    \ TABLE catalog.products (\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n\
    \    description TEXT,\n    picture TEXT,\n    price_currency_code TEXT NOT NULL,\n\
    \    price_units BIGINT NOT NULL,\n    price_nanos INT NOT NULL,\n    categories\
    \ TEXT\n);\n\n-- Product Catalog Service: grant permission to schema\n-- UPDATE\
    \ is required to acquire the ACCESS EXCLUSIVE lock used by the\n-- productCatalogLockContention\
    \ fault-injection flag; the service otherwise\n-- only reads from this schema.\n\
    GRANT SELECT, UPDATE ON ALL TABLES IN SCHEMA catalog TO astronomy_user;\n\n--\
    \ Product Catalog Service: add product data\nINSERT INTO catalog.products (id,\
    \ name, description, picture, price_currency_code, price_units, price_nanos, categories)\n\
    VALUES\n    ('OLJCESPC7Z', 'National Park Foundation Explorascope', 'The National\
    \ Park Foundation''s (NPF) Explorascope 60AZ is a manual alt-azimuth, refractor\
    \ telescope perfect for celestial viewing on the go. The NPF Explorascope 60 can\
    \ view the planets, moon, star clusters and brighter deep sky objects like the\
    \ Orion Nebula and Andromeda Galaxy.', 'NationalParkFoundationExplorascope.jpg',\
    \ 'USD', 101, 960000000, 'telescopes'),\n    ('66VCHSJNUP', 'Starsense Explorer\
    \ Refractor Telescope', 'The first telescope that uses your smartphone to analyze\
    \ the night sky and calculate its position in real time. StarSense Explorer is\
    \ ideal for beginners thanks to the app''s user-friendly interface and detailed\
    \ tutorials. It''s like having your own personal tour guide of the night sky',\
    \ 'StarsenseExplorer.jpg', 'USD', 349, 950000000, 'telescopes'),\n    ('1YMWWN1N4O',\
    \ 'Eclipsmart Travel Refractor Telescope', 'Dedicated white-light solar scope\
    \ for the observer on the go. The 50mm refracting solar scope uses Solar Safe,\
    \ ISO compliant, full-aperture glass filter material to ensure the safest view\
    \ of solar events.  The kit comes complete with everything you need, including\
    \ the dedicated travel solar scope, a Solar Safe finderscope, tripod, a high quality\
    \ 20mm (18x) Kellner eyepiece and a nylon backpack to carry everything in.  This\
    \ Travel Solar Scope makes it easy to share the Sun as well as partial and total\
    \ solar eclipses with the whole family and offers much higher magnifications than\
    \ you would otherwise get using handheld solar viewers or binoculars.', 'EclipsmartTravelRefractorTelescope.jpg',\
    \ 'USD', 129, 950000000, 'telescopes,travel'),\n    ('L9ECAV7KIM', 'Lens Cleaning\
    \ Kit', 'Wipe away dust, dirt, fingerprints and other particles on your lenses\
    \ to see clearly with the Lens Cleaning Kit. This cleaning kit works on all glass\
    \ and optical surfaces, including telescopes, binoculars, spotting scopes, monoculars,\
    \ microscopes, and even your camera lenses, computer screens, and mobile devices.\
    \  The kit comes complete with a retractable lens brush to remove dust particles\
    \ and dirt and two options to clean smudges and fingerprints off of your optics,\
    \ pre-moistened lens wipes and a bottled lens cleaning fluid with soft cloth.',\
    \ 'LensCleaningKit.jpg', 'USD', 21, 950000000, 'accessories'),\n    ('2ZYFJ3GM2N',\
    \ 'Roof Binoculars', 'This versatile, all-around binocular is a great choice for\
    \ the trail, the stadium, the arena, or just about anywhere you want a close-up\
    \ view of the action without sacrificing brightness or detail. It''s an especially\
    \ great companion for nature observation and bird watching, with ED glass that\
    \ helps you spot the subtlest field markings and a close focus of just 6.5 feet.',\
    \ 'RoofBinoculars.jpg', 'USD', 209, 950000000, 'binoculars'),\n    ('0PUK6V6EV0',\
    \ 'Solar System Color Imager', 'You have your new telescope and have observed\
    \ Saturn and Jupiter. Now you''re ready to take the next step and start imaging\
    \ them. But where do you begin? The NexImage 10 Solar System Imager is the perfect\
    \ solution.', 'SolarSystemColorImager.jpg', 'USD', 175, 0, 'accessories,telescopes'),\n\
    \    ('LS4PSXUNUM', 'Red Flashlight', 'This 3-in-1 device features a 3-mode red\
    \ flashlight, a hand warmer, and a portable power bank for recharging your personal\
    \ electronics on the go. Whether you use it to light the way at an astronomy star\
    \ party, a night walk, or wildlife research, ThermoTorch 3 Astro Red''s rugged,\
    \ IPX4-rated design will withstand your everyday activities.', 'RedFlashlight.jpg',\
    \ 'USD', 57, 80000000, 'accessories,flashlights'),\n    ('9SIQT8TOJO', 'Optical\
    \ Tube Assembly', 'Capturing impressive deep-sky astroimages is easier than ever\
    \ with Rowe-Ackermann Schmidt Astrograph (RASA) V2, the perfect companion to today''s\
    \ top DSLR or astronomical CCD cameras. This fast, wide-field f/2.2 system allows\
    \ for shorter exposure times compared to traditional f/10 astroimaging, without\
    \ sacrificing resolution. Because shorter sub-exposure times are possible, your\
    \ equatorial mount won''t need to accurately track over extended periods. The\
    \ short focal length also lessens equatorial tracking demands. In many cases,\
    \ autoguiding will not be required.', 'OpticalTubeAssembly.jpg', 'USD', 3599,\
    \ 0, 'accessories,telescopes,assembly'),\n    ('6E92ZMYYFZ', 'Solar Filter', 'Enhance\
