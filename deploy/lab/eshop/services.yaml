# eShop lab: the .NET services, hand-written plain manifests mirroring the
# AppHost's wiring (src/eShop.AppHost/AppHost.cs). Deploy with apply.sh,
# which fills in ${ESHOP_REGISTRY} and ${ESHOP_TAG} (see README.md).
#
# What Aspire would inject is set explicitly: ConnectionStrings__<name> for
# each WithReference to a backing service, services__<name>__http__0 for
# each project reference, Identity__Url / IdentityUrl / CallBackUrl and the
# identity callback URLs. Connection strings carry no password: Npgsql reads
# PGPASSWORD from the Secret eshop-postgres. The RabbitMQ connection string
# is shared through the ConfigMap eshop-eventbus (envFrom).
#
# Containers listen on 8080 (the .NET image default); each exposed service
# maps port 80 to it, so http://<name> resolves through cluster DNS as
# Aspire service discovery does. order-processor and payment-processor are
# background workers with no Service. Probes are TCP: the default
# endpoints map /health only in Development, and basket-api speaks HTTP/2
# (gRPC) only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-common
  namespace: eshop
data:
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-eventbus
  namespace: eshop
data:
  ConnectionStrings__eventbus: amqp://eventbus:5672
---
# Identity.API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
  labels:
    app: identity-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # the .NET images' app user
      containers:
        - name: identity-api
          image: ${ESHOP_REGISTRY}/eshop/identity-api:${ESHOP_TAG}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: eshop-common
          env:
            - name: ConnectionStrings__identitydb
              value: "Host=postgres;Port=5432;Username=postgres;Database=identitydb"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-postgres
                  key: password
            - name: BasketApiClient
              value: "http://basket-api"
            - name: OrderingApiClient
              value: "http://ordering-api"
            - name: WebhooksApiClient
              value: "http://webhooks-api"
            - name: WebhooksWebClient
              value: "http://webhooksclient"
            - name: WebAppClient
              value: "http://webapp"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop
spec:
  selector:
    app: identity-api
  ports:
    - port: 80
      targetPort: http
      name: http
---
