---
# WebApp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: eshop
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # the .NET images' app user
      initContainers:
        # The image's CA bundle plus the lab CA, for SSL_CERT_FILE.
        - name: ca-bundle
          image: ${ESHOP_REGISTRY}/eshop/webapp:${ESHOP_TAG}
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /lab-ca/ca.crt > /ca-bundle/ca-certificates.crt"]
          volumeMounts:
            - name: lab-ca
              mountPath: /lab-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: webapp
          image: ${ESHOP_REGISTRY}/eshop/webapp:${ESHOP_TAG}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: eshop-common
            - configMapRef:
                name: eshop-eventbus
          env:
            - name: SSL_CERT_FILE
              value: "/ca-bundle/ca-certificates.crt"
            - name: services__basket-api__http__0
              value: "http://basket-api"
            - name: services__catalog-api__http__0
              value: "http://catalog-api"
            - name: services__ordering-api__http__0
              value: "http://ordering-api"
            - name: IdentityUrl
              value: "http://identity-api"
            - name: CallBackUrl
              value: "http://webapp"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca-bundle
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: lab-ca
          secret:
            secretName: eshop-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: eshop
spec:
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: http
      name: http
