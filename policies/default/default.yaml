# Release policy for the default/default project.
#
# Policies live at policies/{tenant}/{project_id}.yaml. A project without a
# policy is never approved (POLICY_MISSING). Unknown keys are rejected.
#
# This default is the strictest setting: every discovery source must have
# succeeded in a baseline under 24h old, runtime evidence must come from a
# live telemetry query, and nothing is exempt.
policy_version: 1
tenant: default
project_id: default

# Hours; 1..24. A project may require fresher baselines, never older ones.
max_baseline_age_hours: 24

# Discovery stages that must have SUCCEEDED (SKIPPED does not count).
required_sources: [STATIC_CODE, K8S_MANIFEST, RUNTIME_TELEMETRY]

# live: a completed live telemetry query for this assessment.
# baseline: live, or runtime edges from the baseline snapshot.
runtime_evidence: live

# Explicit, justified allowlist. Example entries:
#   files:
#     - pattern: "docs/*"        # fnmatch; '*' also matches '/'
#       reason: "Documentation only"
#   dependencies:
#     - entity_id: "unresolved:api.stripe.com"
#       reason: "External payment API, contract monitored separately"
exemptions:
  files: []
  dependencies: []
